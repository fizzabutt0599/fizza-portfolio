<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <radialGradient id="glow" cx="78%" cy="18%" r="55%">
      <stop offset="0" stop-color="#c6ff3d" stop-opacity=".28"/>
      <stop offset="1" stop-color="#c6ff3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="95%" r="55%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".22"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#f3efe6" stroke-opacity=".05"/>
    </pattern>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c6ff3d" stop-opacity=".6"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity=".25"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="#111113"/>
  <rect width="800" height="1000" fill="url(#grid)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <rect width="800" height="1000" fill="url(#glow2)"/>

  <!-- oversized monogram -->
  <text x="400" y="560" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        font-size="520" fill="none" stroke="#f3efe6" stroke-opacity=".12" stroke-width="2">Fb</text>

  <!-- top meta -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="4" fill="#a3a09a">
    <text x="60" y="80">PORTFOLIO</text>
    <text x="740" y="80" text-anchor="end">ISB · PK</text>
  </g>
  <circle cx="60" cy="118" r="5" fill="#c6ff3d"/>
  <path d="M80 118H300" stroke="#f3efe6" stroke-opacity=".15"/>

  <!-- code window -->
  <g transform="translate(90 300)">
    <rect width="620" height="360" rx="28" fill="#18181b" stroke="url(#edge)" stroke-width="1.5"/>
    <path d="M0 64H620" stroke="#f3efe6" stroke-opacity=".08"/>
    <circle cx="36" cy="32" r="7" fill="#3a3a40"/>
    <circle cx="60" cy="32" r="7" fill="#3a3a40"/>
    <circle cx="84" cy="32" r="7" fill="#c6ff3d"/>
    <text x="584" y="38" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#5c5a55">about.ts</text>
    <g font-family="Consolas, 'Courier New', monospace" font-size="24">
      <text x="36" y="118"><tspan fill="#a78bfa">const</tspan><tspan fill="#f3efe6"> fizza = {</tspan></text>
      <text x="68" y="166"><tspan fill="#a3a09a">role: </tspan><tspan fill="#c6ff3d">"Full Stack Developer"</tspan><tspan fill="#a3a09a">,</tspan></text>
      <text x="68" y="214"><tspan fill="#a3a09a">based: </tspan><tspan fill="#c6ff3d">"Islamabad"</tspan><tspan fill="#a3a09a">,</tspan></text>
      <text x="68" y="262"><tspan fill="#a3a09a">stack: [</tspan><tspan fill="#c6ff3d">"React"</tspan><tspan fill="#a3a09a">, </tspan><tspan fill="#c6ff3d">"Next.js"</tspan><tspan fill="#a3a09a">, </tspan><tspan fill="#c6ff3d">"PHP"</tspan><tspan fill="#a3a09a">],</tspan></text>
      <text x="36" y="310" fill="#f3efe6">};<tspan fill="#c6ff3d">▍</tspan></text>
    </g>
  </g>

  <!-- floating tags -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="18">
    <rect x="470" y="240" width="170" height="44" rx="22" fill="#c6ff3d"/>
    <text x="555" y="268" text-anchor="middle" fill="#0b0b0c" font-weight="700">Frontend</text>
    <rect x="130" y="690" width="160" height="44" rx="22" fill="none" stroke="#f3efe6" stroke-opacity=".3"/>
    <text x="210" y="718" text-anchor="middle" fill="#f3efe6">Backend</text>
    <rect x="310" y="690" width="190" height="44" rx="22" fill="none" stroke="#a78bfa" stroke-opacity=".6"/>
    <text x="405" y="718" text-anchor="middle" fill="#a78bfa">WordPress</text>
  </g>
</svg>
